services:
  app:
    build: .
    environment:
      DATABASE_URL: postgres://polyworlds:${DB_PASSWORD}@db:5432/polyworlds_db
      PORT: 3000
      RENDERER_URL: http://renderer:3001
    depends_on:
      - db
    volumes:
      - assets_data:/assets
      - textures_data:/textures
    networks: [internal]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: polyworlds
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: polyworlds_db
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [internal, shared]
  renderer:
    build: ./renderer
    restart: unless-stopped
    volumes:
      - assets_data:/assets
      - textures_data:/textures
    environment:
      - ASSETS_DIR=/assets
      - ASSET_BASE_URL=https://assets.polyworlds.net
      - TEXTURES_DIR=/textures
    networks: [internal]
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - assets_data:/srv/assets:ro
      - textures_data:/srv/textures:ro
    networks: [internal, shared]
volumes:
  db_data:
  caddy_data:
  assets_data:
  textures_data:

networks:
  internal:
  shared:
    external: true
    name: polyworlds_shared
